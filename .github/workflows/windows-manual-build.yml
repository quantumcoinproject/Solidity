
name: Windows Manual Build

on:
  workflow_dispatch:  

jobs:
  windows-build:

    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake
        run: |
          cd ${{ github.workspace }}
          powershell Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v4.2.0-rc3/cmake-4.2.0-rc3-windows-x86_64.zip" -OutFile cmake-4.2.0-rc3-windows-x86_64.zip  
          powershell Expand-Archive -Path cmake-4.2.0-rc3-windows-x86_64.zip -DestinationPath ${{ github.workspace }}\
          ls ${{ github.workspace }}\
          ls ${{ github.workspace }}\cmake-4.2.0-rc3-windows-x86_64
          ls ${{ github.workspace }}\cmake-4.2.0-rc3-windows-x86_64\bin\cmake.exe
          ${{ github.workspace }}\cmake-4.2.0-rc3-windows-x86_64\bin\cmake.exe

      - name: Install boost
        run: |
          cd ${{ github.workspace }}
          curl https://archives.boost.io/release/1.74.0/binaries/boost_1_74_0-bin-msvc-all-32-64.7z -o boost_1_74_0-bin-msvc-all-32-64.7z
          tar -xzvf boost_1_74_0-bin-msvc-all-32-64.7z
          ls ${{ github.workspace }}

        # NOTE: If a boost version matching all requirements cannot be found,
        # this build step will fail

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
            arch: x64

      - name: cl.exe should be found now
        run: |
          $(Get-Command cl -ErrorAction SilentlyContinue) -or $(throw "cl.exe wasn't found!")
      
      - name: Install evmone
        shell: pwsh
        run: |
          .\scripts\install_evmone.ps1
          
      - name: Configure Solidity
        run: |
          mkdir ${{ github.workspace }}\build
          ${{ github.workspace }}\cmake-4.2.0-rc3-windows-x86_64\bin\cmake -G "Visual Studio 17 2022" -A Win32 -DCMAKE_INSTALL_PREFIX=c:\github\Solidity\build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DUSE_Z3=OFF -DUSE_CVC4=OFF -DBoost_DIR=${{ github.workspace }}\boost_1_74_0 -DBoost_INCLUDE_DIR=${{ github.workspace }}\boost_1_74_0 -DBoost_LIBRARY_DIRS=${{ github.workspace }}\boost_1_74_0\l\libs .

      - name: Build Solidity
        run: |
          cmake --build . --config Release -j 12

      - name: Install Solidity
        run: |
          cmake --install . 

      - name: Upload Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ github.workspace }}\solc

