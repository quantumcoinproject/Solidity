
name: Windows Manual Build

on:
  workflow_dispatch:  

jobs:
  windows-build:

    # Pinned to windows-2022: since June 2026, windows-latest (windows-2025)
    # ships Visual Studio 2026 only, so the "Visual Studio 17 2022" generator
    # below finds no VS instance there. If GitHub retires the windows-2022
    # image, move to windows-latest AND change the generator to
    # "Visual Studio 18 2026" (this codebase is known to build with VS 2026).
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4

      - name: Install boost
        run: |
          cd ${{ github.workspace }}
          curl https://archives.boost.io/release/1.74.0/binaries/boost_1_74_0-bin-msvc-all-32-64.7z -o boost_1_74_0-bin-msvc-all-32-64.7z
          tar -xzvf boost_1_74_0-bin-msvc-all-32-64.7z
          ls ${{ github.workspace }}

        # NOTE: If a boost version matching all requirements cannot be found,
        # this build step will fail

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
            arch: x64

      - name: cl.exe should be found now
        run: |
          $(Get-Command cl -ErrorAction SilentlyContinue) -or $(throw "cl.exe wasn't found!")
      
      - name: Install evmone
        run: |
          powershell .\scripts\install_evmone.ps1
          
      - name: Configure Solidity
        run: |
          mkdir ${{ github.workspace }}\build
          powershell New-Item prerelease.txt -type file
          cmake -G "Visual Studio 17 2022" -A Win32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=c:\github\Solidity\build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DUSE_Z3=OFF -DUSE_CVC4=OFF -DBoost_DIR=${{ github.workspace }}\boost_1_74_0 -DBoost_INCLUDE_DIR=${{ github.workspace }}\boost_1_74_0 -DBoost_LIBRARY_DIRS=${{ github.workspace }}\boost_1_74_0\l\libs .

      - name: Build Solidity
        run: |
          cmake --build . --config Release -j 12

      - name: Install Solidity
        run: |
          cmake --install . 

      - name: Upload Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ github.workspace }}\solc

