
name: Windows Manual Build

on:
  workflow_dispatch:  

jobs:
  windows-build:

    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4

      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
            # REQUIRED: Specify the required boost version
            # A list of supported versions can be found here:
            # https://github.com/MarkusJx/prebuilt-boost/blob/main/versions-manifest.json
            boost_version: 1.74.0
            boost_install_dir: ${{ github.workspace }}\deps\boost\lib\cmake\Boost-1.74.0

        # NOTE: If a boost version matching all requirements cannot be found,
        # this build step will fail

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
            arch: x64

      - name: cl.exe should be found now
        run: |
          $(Get-Command cl -ErrorAction SilentlyContinue) -or $(throw "cl.exe wasn't found!")
      
      - name: Install evmone
        shell: pwsh
        run: |
          .\scripts\install_evmone.ps1
          
      - name: Configure Solidity
        run: |
          mkdir ${{ github.workspace }}\build
          dir ${{ steps.install-boost.outputs.BOOST_ROOT }}
          cmake -G "Visual Studio 17 2022" -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\build\windows-release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DUSE_Z3=OFF -DUSE_CVC4=OFF -DBoost_DIR=${{ steps.install-boost.outputs.BOOST_ROOT }} .

      - name: Build Solidity
        run: |
          cmake --build . --config Release -j 12

      - name: Install Solidity
        run: |
          cmake --install . 

      - name: Upload Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ github.workspace }}\solc

